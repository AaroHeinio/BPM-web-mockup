<script>
class DCLogic{constructor(){}setState(p){Object.assign(this.state,p);render();}}


class Component extends DCLogic {
renderVals() {
return {};
}
}


(function(){
const tplHTML=document.getElementById('tpl').textContent;
const t=document.createElement('template');t.innerHTML=tplHTML;
const app=document.getElementById('app');
const VOID=new Set(['input','img','br','hr','meta','link']);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA=s=>esc(s).replace(/"/g,'&quot;');
let handlers=[];
function ev(expr,scope){return new Function('s','with(s){return ('+expr+')}')(scope);}
function sub(str,scope,asText){return str.replace(/\{\{\s*([\s\S]+?)\s*\}\}/g,(m,e)=>{const v=ev(e,scope);return v==null?'':(asText?esc(v):escA(v));});}
function walk(node,scope){
 if(node.nodeType===3)return sub(node.nodeValue,scope,true);
 if(node.nodeType!==1)return '';
 const tag=node.tagName.toLowerCase();
 const kids=(sc)=>Array.from(node.childNodes).map(c=>walk(c,sc)).join('');
 if(tag==='sc-for'){
  const arr=ev(node.getAttribute('each').replace(/^\{\{|\}\}$/g,'').trim(),scope)||[];
  const as=node.getAttribute('as');let out='';
  arr.forEach(item=>{const s2=Object.create(scope);s2[as]=item;out+=kids(s2);});return out;}
 if(tag==='sc-if'){
  const v=ev(node.getAttribute('value').replace(/^\{\{|\}\}$/g,'').trim(),scope);
  return v?kids(scope):'';}
 let a='';
 for(const at of Array.from(node.attributes)){
  const n=at.name,v=at.value;
  if(n.startsWith('hint-'))continue;
  if(n.startsWith('on')&&/^\{\{[\s\S]+\}\}$/.test(v.trim())){
   const fn=ev(v.trim().replace(/^\{\{|\}\}$/g,'').trim(),scope);
   handlers.push(fn);a+=' data-h-'+n.slice(2).toLowerCase()+'="'+(handlers.length-1)+'"';continue;}
  a+=' '+n+'="'+sub(v,scope,false)+'"';
 }
 if(VOID.has(tag))return '<'+tag+a+'>';
 return '<'+tag+a+'>'+kids(scope)+'</'+tag+'>';
}
window.render=function(){
 handlers=[];
 const vals=window.__c.renderVals();
 const scope=Object.assign(Object.create(null),vals);
 app.innerHTML=Array.from(t.content.childNodes).map(n=>walk(n,scope)).join('');
 app.querySelectorAll('*').forEach(el=>{
  for(const at of Array.from(el.attributes)){
   if(at.name.startsWith('data-h-')){
    const type=at.name.slice(7),fn=handlers[+at.value];
    el.addEventListener(type,fn);}
  }
 });
};
window.__c=new Component();
window.render();
})();
</script>
