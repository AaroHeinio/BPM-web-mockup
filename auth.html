<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BPM Sign up and Log in</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E11}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #B79CFF;outline-offset:3px}
.tab{flex:1;padding:13px 16px;border:0;border-radius:12px;background:transparent;color:#A9A6BA;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
.tab-on{background:#B79CFF;color:#14101F}
.field{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:14px 16px;border-radius:12px;border:1.5px solid #3A3848;background:#14141A;color:#F4F3F8;font:500 16px Inter,system-ui,sans-serif}
.field:focus{border-color:#B79CFF}
.go{display:block;text-align:center;padding:15px 20px;border-radius:999px;background:#B79CFF;color:#14101F;font-weight:700;font-size:16px}
.go:hover{background:#C9B5FF}

@media (max-width:820px){
#app header,#app section,#app footer{padding-left:20px !important;padding-right:20px !important}
#app header{gap:12px 20px !important;padding-top:16px !important}
#app section{padding-top:32px !important;padding-bottom:56px !important;gap:32px !important}
#app h1{font-size:40px !important;line-height:1.08 !important}
#app h2{font-size:30px !important}
#app div[style*="padding:64px"]{padding:32px 24px !important}
#app div[style*="padding:40px 64px"],#app div[style*="padding:48px 64px"]{padding-left:20px !important;padding-right:20px !important}
}
</style>

</head>
<body>
<div id="app"></div>
<script type="text/template" id="tpl">

<div style="display:flex;flex-wrap:wrap;min-height:880px;background:#0E0E11;color:#F4F3F8;font-family:Inter,system-ui,sans-serif">

<div style="flex:1 1 480px;padding:40px 64px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;gap:40px;background:linear-gradient(180deg,#1E2048 0%,#6B4D9E 60%,#E9A98F 100%)">
<a href="index.html" aria-label="Back to BPM home" style="display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px"><span style="display:inline-block;width:28px;height:28px;border-radius:8px;background:#F4F3F8"></span>BPM</a>
<div>
<h2 style="margin:0;font-size:52px;line-height:1.05;font-weight:800;letter-spacing:-.03em;max-width:480px">Steer the mood. Know why.</h2>
<p style="margin:20px 0 0;max-width:420px;font-size:18px;line-height:1.55;color:#F0E9FF">One account for the web player and the app.</p>
</div>
</div>

<div style="flex:1 1 480px;padding:48px 64px;box-sizing:border-box;display:flex;align-items:center;justify-content:center">
<div style="width:100%;max-width:420px">
<div style="display:flex;gap:6px;padding:6px;border-radius:16px;background:#1A1A21" role="group" aria-label="Choose form">
<button class="{{ signupClass }}" onClick="{{ goSignup }}">Sign up</button>
<button class="{{ loginClass }}" onClick="{{ goLogin }}">Log in</button>
</div>

<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ true }}">
<h1 style="margin:36px 0 8px;font-size:34px;font-weight:800;letter-spacing:-.02em">Create your account</h1>
<p style="margin:0 0 28px;font-size:16px;color:#A9A6BA">Start listening in your browser in under a minute.</p>
<form onSubmit="{{ stop }}">
<label style="display:block;font-size:14px;font-weight:600;margin-bottom:20px">Name<input class="field" type="text" placeholder="Your name" autocomplete="name"></label>
<label style="display:block;font-size:14px;font-weight:600;margin-bottom:20px">Email<input class="field" type="email" placeholder="you@example.com" autocomplete="email"></label>
<label style="display:block;font-size:14px;font-weight:600;margin-bottom:28px">Password<input class="field" type="password" placeholder="At least 8 characters" autocomplete="new-password"></label>
<a class="go" href="home.html">Create account</a>
</form>
<p style="margin:20px 0 0;font-size:13px;line-height:1.5;color:#A9A6BA">By creating an account you accept the <a href="support.html" style="color:#B79CFF;text-decoration:underline">terms</a> and the <a href="support.html" style="color:#B79CFF;text-decoration:underline">privacy policy</a>.</p>
</sc-if>

<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ false }}">
<h1 style="margin:36px 0 8px;font-size:34px;font-weight:800;letter-spacing:-.02em">Welcome back</h1>
<p style="margin:0 0 28px;font-size:16px;color:#A9A6BA">Log in to pick up where you left off.</p>
<form onSubmit="{{ stop }}">
<label style="display:block;font-size:14px;font-weight:600;margin-bottom:20px">Email<input class="field" type="email" placeholder="you@example.com" autocomplete="email"></label>
<label style="display:block;font-size:14px;font-weight:600;margin-bottom:12px">Password<input class="field" type="password" placeholder="Your password" autocomplete="current-password"></label>
<a href="support.html" style="display:inline-block;padding:10px 0;margin-bottom:12px;font-size:14px;color:#B79CFF;text-decoration:underline">Forgot your password?</a>
<a class="go" href="home.html">Log in</a>
</form>
</sc-if>

<a href="index.html" style="display:inline-block;margin-top:28px;padding:10px 0;font-size:14px;color:#A9A6BA">← Back to home</a>
</div>
</div>

</div>
</script>
<script>
class DCLogic{constructor(){}setState(p){Object.assign(this.state,p);render();}}


class Component extends DCLogic {
state = { mode: 'signup' };
renderVals() {
const m = this.state.mode;
return {
isSignup: m === 'signup',
isLogin: m === 'login',
signupClass: m === 'signup' ? 'tab tab-on' : 'tab',
loginClass: m === 'login' ? 'tab tab-on' : 'tab',
goSignup: () => this.setState({ mode: 'signup' }),
goLogin: () => this.setState({ mode: 'login' }),
stop: (e) => { if (e && e.preventDefault) e.preventDefault(); }
};
}
}


(function(){
const tplHTML=document.getElementById('tpl').textContent;
const t=document.createElement('template');t.innerHTML=tplHTML;
const app=document.getElementById('app');
const VOID=new Set(['input','img','br','hr','meta','link']);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA=s=>esc(s).replace(/"/g,'&quot;');
let handlers=[];
function ev(expr,scope){return new Function('s','with(s){return ('+expr+')}')(scope);}
function sub(str,scope,asText){return str.replace(/\{\{\s*([\s\S]+?)\s*\}\}/g,(m,e)=>{const v=ev(e,scope);return v==null?'':(asText?esc(v):escA(v));});}
function walk(node,scope){
 if(node.nodeType===3)return sub(node.nodeValue,scope,true);
 if(node.nodeType!==1)return '';
 const tag=node.tagName.toLowerCase();
 const kids=(sc)=>Array.from(node.childNodes).map(c=>walk(c,sc)).join('');
 if(tag==='sc-for'){
  const arr=ev(node.getAttribute('each').replace(/^\{\{|\}\}$/g,'').trim(),scope)||[];
  const as=node.getAttribute('as');let out='';
  arr.forEach(item=>{const s2=Object.create(scope);s2[as]=item;out+=kids(s2);});return out;}
 if(tag==='sc-if'){
  const v=ev(node.getAttribute('value').replace(/^\{\{|\}\}$/g,'').trim(),scope);
  return v?kids(scope):'';}
 let a='';
 for(const at of Array.from(node.attributes)){
  const n=at.name,v=at.value;
  if(n.startsWith('hint-'))continue;
  if(n.startsWith('on')&&/^\{\{[\s\S]+\}\}$/.test(v.trim())){
   const fn=ev(v.trim().replace(/^\{\{|\}\}$/g,'').trim(),scope);
   handlers.push(fn);a+=' data-h-'+n.slice(2).toLowerCase()+'="'+(handlers.length-1)+'"';continue;}
  a+=' '+n+'="'+sub(v,scope,false)+'"';
 }
 if(VOID.has(tag))return '<'+tag+a+'>';
 return '<'+tag+a+'>'+kids(scope)+'</'+tag+'>';
}
window.render=function(){
 handlers=[];
 const vals=window.__c.renderVals();
 const scope=Object.assign(Object.create(null),vals);
 app.innerHTML=Array.from(t.content.childNodes).map(n=>walk(n,scope)).join('');
 app.querySelectorAll('*').forEach(el=>{
  for(const at of Array.from(el.attributes)){
   if(at.name.startsWith('data-h-')){
    const type=at.name.slice(7),fn=handlers[+at.value];
    el.addEventListener(type,fn);}
  }
 });
};
window.__c=new Component();
window.render();
})();
</script>
</body>
</html>
